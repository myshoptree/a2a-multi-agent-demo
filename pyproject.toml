[project]
name = "a2a-multi-agent-demo"
version = "0.1.0"
description = "Demo A2A: dos agentes en un mismo servidor, comunicación por URL y discovery dinámico"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk>=0.2.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "openai>=1.57.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "starlette>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
